version: '3.8'

services:
  netsentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netsentinel-app
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite database file
      - netsentinel-db-data:/app/data
      # Persist structured logs (audit logs, runtime logs)
      - netsentinel-logs:/app/logs
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
      - DATABASE_URL=sqlite:////app/data/netsentinel.db
      - AUDIT_LOG_PATH=/app/logs/audit.log
      - RATE_LIMIT_ENABLED=True
      - RATE_LIMIT_SENSITIVE_RPM=5
      - RATE_LIMIT_DEFAULT_RPM=100
      - MONITOR_INTERVAL_SECONDS=60
      - AUTO_START_MONITORING=True
    restart: unless-stopped

volumes:
  netsentinel-db-data:
    driver: local
  netsentinel-logs:
    driver: local
